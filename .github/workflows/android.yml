name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (release)
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=https://ecozqbecxbpicxwjmtcv.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_f2ViyzVqy0bbM8JyonEUZQ_6Kpeydhz

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/xpress-v1.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpress-apk
          path: build/app/outputs/flutter-apk/xpress-v1.0.1.apk
          if-no-files-found: error

      - name: Publish downloadable APK (tag جديد لكل إصدار)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: XPRESS v1.0.1 (إصلاح فتح التطبيق)
          body: أساس التطبيق يعمل — تسجيل دخول، تسوّق، كتالوج حقيقي.
          files: build/app/outputs/flutter-apk/xpress-v1.0.1.apk
          make_latest: true
